name: "Terraform CI/CD Pipeline Create Website"

on: workflow_dispatch
  
permissions:
  contents: read
  pull-requests: write # Required for writing plan outputs as comments on PRs

env:
  # Replace with your actual cloud credentials or OIDC configurations
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TF_LOG: INFO

jobs:
  terraform:
    name: "Terraform Process"
    runs-on: ubuntu-latest

    steps:
      # 1. Clone your source code onto the GitHub runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Install the specified version of the Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0 # Define your exact targeted version

      - name: Terraform init
        run: terraform init

# 8. Deploy your configurations permanently upon direct merges into main branch
      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false